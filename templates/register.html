<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | EstateFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1f2937;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0 0 8px;
            color: #176b48;
            font-size: 30px;
        }

        .brand p {
            margin: 0;
            color: #64748b;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: 2px solid #176b48;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #176b48;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #125438;
        }

        .message {
            margin-bottom: 16px;
            padding: 11px;
            border-radius: 7px;
            background: #fff1f2;
            color: #b42318;
            font-size: 14px;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #176b48;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="register-card">

        <div class="brand">
            <h1>EstateFlow</h1>
            <p>Property Management System</p>
        </div>

        <h2>Create your account</h2>
        <p>Register to explore or list properties.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="message">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">

            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" maxlength="100"
                    autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" maxlength="150"
                    autocomplete="email" required>
            </div>

            <div class="field">
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}" maxlength="10" minlength="10" autocomplete="tel" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password (8+ characters)"
                    minlength="8" autocomplete="new-password" required>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                    placeholder="Re-enter your password" minlength="8" autocomplete="new-password" required>
            </div>

            <div class="field">
                <label for="role">Register as</label>
                <select name="role" id="role" required>
                    <option value="user">User — Browse properties</option>
                    <option value="owner">Owner — List properties</option>
                </select>
            </div>

            <button type="submit">Create Account</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </main>
</body>

</html>
